[project]
name = "depthba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam Burhan", email = "adam14011999@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "enlighten>=1.14.1",
    "numpy>=2.5.1",
    "pycolmap==4.1.0",
    # macOS: fork wheel + pycolmap still collide on glog (static/dynamic mix,
    # same vcpkg snapshot) — BA prototyping happens on Linux (snoopy/cluster).
    "pyceres==2.7.2; sys_platform == 'linux'",
    "pyyaml>=6.0",
    "viser>=1.0.30",
    "pandas>=3.0.5",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "pillow>=11",
]

# pyceres comes from our fork's release wheels (depth factors; vcpkg snapshot
# must stay matched to the pinned pycolmap — see adamburhan/pyceres).
[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
pyceres = [
    { url = "https://github.com/adamburhan/pyceres/releases/download/v2.7.2/pyceres-2.7.2-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
]
viz = [
    "embreex>=4.4.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.9",
    "scipy>=1.18.0",
    "trimesh>=4.12.2",
]
