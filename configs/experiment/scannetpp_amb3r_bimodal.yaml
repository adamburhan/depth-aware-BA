# @package _global_
# Experiment preset: pins the db/depth_extract options and derives all
# paths from ${sequence}, so an invocation is just
#
#   python run.py experiment=scannetpp_amb3r_bimodal sequence=09c1414f1b
#
# or, submitting one SLURM job per sequence:
#
#   python run.py -m hydra/launcher=cpu experiment=scannetpp_amb3r_bimodal \
#       'sequence=09c1414f1b,0d2ee665be,13c3e046d7'

defaults:
  - override /db: scannetpp_amb3r
  - override /depth_extract: bimodal

data_root: ${oc.env:SCRATCH}/datasets/scannetpp/data/amb3r
output_dir: ${oc.env:SCRATCH}/experiments/depth-aware-ba/scannetpp_amb3r/${sequence}/dslr
dump_dir: ${data_root}/${sequence}/dslr/depth_bundles
