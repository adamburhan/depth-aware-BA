# amb3r inference + npz unpack, T&T layout: video frames under <seq>/images/.
# out_subdir keeps a "dslr" level it does not really have, so every analysis
# script's <seq>/dslr/ba path keeps working across datasets.
amb3r_repo: ${oc.env:HOME}/repos/amb3r
image_subdir: "{sequence}/images"        # under raw_root
out_subdir: "{sequence}/dslr"            # under data_root
