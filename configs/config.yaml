defaults:
  - preprocess: amb3r
  - db: eth3d_courtyard
  - depth_extract: bimodal
  - depthba: baseline
  - experiment: null
  - _self_

stages: [db, attach]

# Machine/run-specific — set via an experiment preset or CLI overrides
# (data_root=... sequence=... etc.).
raw_root: ???      # original dataset tree (preprocess input)
data_root: ???
output_dir: ???
sequence: null
exp_id: null   # suffix on the ba variant dir; distinguishes repeats of one condition
dump_dir: ???
vocab_tree_path: null
force: false   # re-run the selected stages even if their done markers exist
